# Invented, secret-shaped test data: LeakBench's attack corpus and one sample per credential rule. GitHub's secret
# scanning and push protection skip these folders; a key anywhere else still stops a push. CI's gitleaks job holds
# the rest of the tree, and the whole history, to zero findings (.gitleaks.toml).
paths-ignore:
  - "tests/data/**"
  - "bench/leakbench/**"
