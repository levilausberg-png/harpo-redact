name: release
# Two ways to start it: push a tag v2.5.0, or open Actions, choose "release", Run workflow on main and type 2.5.0.
# Either way nothing is published, and with Run workflow not even the tag exists, until every check below has passed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in pyproject.toml (e.g. 2.5.0)"
        required: true
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    # The whole ci workflow on exactly this commit: lint, types, the dependency audit, every test (browser and rendering
    # tests required), the secret scan and the Docker smoke test.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: The tag, the package and the changelog name the same version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          code=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/harpo_redact/__init__.py").read())[1])')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION#v}"
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Run the release on $DEFAULT_BRANCH, not $GITHUB_REF_NAME."; exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "::error::$tag exists already."; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag $tag, pyproject $version, harpo_redact $code"
          if [ "$tag" != "v$version" ]; then echo "::error::$tag does not match pyproject.toml ($version)."; exit 1; fi
          if [ "$code" != "$version" ]; then echo "::error::harpo_redact says $code, pyproject.toml $version."; exit 1; fi
          if ! grep -q "^## $version\$" docs/CHANGELOG.md; then echo "::error::docs/CHANGELOG.md has no ## $version."; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Nothing is still a placeholder (repository, licensor, security contact)
        run: python3 tools/set_repo.py --check

  image:
    needs: [verify, preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.preflight.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preflight.outputs.tag }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  published:
    # Pull the image that was just pushed, by digest, and put it through the same Docker smoke test.
    needs: [preflight, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The published image passes the smoke test
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          docker pull "$image"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          docker tag "$image" "harpo-redact:$version"
          docker run --rm "harpo-redact:$version" --version
          python3 tools/docker_smoke.py --no-build

  dist:
    needs: [verify, preflight, image, published]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist (hash-pinned build tools)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-build.lock
          python -m build --no-isolation
      - name: SBOM and checksums
        run: |
          python tools/make_sbom.py > dist/sbom.cdx.json
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}   # with Run workflow, the tag is created here, on the commit just verified
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
