name: ci
on:
  push:
    branches: ["**"]   # a tag is verified by the release workflow, which runs this whole workflow before publishing
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Evidence that cannot run fails here instead of skipping: the console's browser tests, the LibreOffice rendering
      # of redacted Office files and the language-model tests (tests/conftest.py, needs()).
      HARPO_REQUIRE: browser,libreoffice,models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (every package and model hash-pinned)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock -r requirements-models.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Chromium and LibreOffice, for the browser and rendering tests
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
          soffice --version
      - name: Lint and types
        run: |
          ruff check src tests bench tools
          ruff format --check src tests bench tools
          mypy
          bandit -q -r src -c pyproject.toml
      - name: Dependency audit
        run: pip-audit -r requirements.lock --require-hashes
      - name: Tests (conformance, the invariants, the LeakBench gate, the browser and rendering tests)
        run: pytest -q -rs
      - name: SBOM
        run: python tools/make_sbom.py > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, not just this commit
      - name: Secret scan of the tree and the whole history (gitleaks, checksum-pinned; .gitleaks.toml allows the invented test data)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --config .gitleaks.toml
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --config .gitleaks.toml

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and run it the way the README does
        # check-config on the shipped example, the demo, then the hardened compose file: healthy, sanitized requests
        # in both API styles, the live policy across a restart and a recreated container, no content in the logs,
        # a clean shutdown.
        run: python3 tools/docker_smoke.py
