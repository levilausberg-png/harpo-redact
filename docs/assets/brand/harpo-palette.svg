<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Harpo palette"><title>Harpo palette</title><rect width="920" height="150" rx="14" fill="#0B1222"/><rect x="16" y="16" width="136" height="96" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/><text x="28" y="88" fill="#E2E8F0" font-size="13" font-weight="600">Midnight Slate</text><text x="28" y="104" fill="#E2E8F0" font-size="11" opacity=".8" font-family="ui-monospace, Menlo, monospace">#0F172A</text><text x="16" y="134" fill="#94A3B8" font-size="11">canvas, the tile</text><rect x="164" y="16" width="136" height="96" rx="10" fill="#E2E8F0"/><text x="176" y="88" fill="#0F172A" font-size="13" font-weight="600">Silver</text><text x="176" y="104" fill="#0F172A" font-size="11" opacity=".8" font-family="ui-monospace, Menlo, monospace">#E2E8F0</text><text x="164" y="134" fill="#94A3B8" font-size="11">text, the harp</text><rect x="312" y="16" width="136" height="96" rx="10" fill="#2EE6A8"/><text x="324" y="88" fill="#0F172A" font-size="13" font-weight="600">Cyber Jade</text><text x="324" y="104" fill="#0F172A" font-size="11" opacity=".8" font-family="ui-monospace, Menlo, monospace">#2EE6A8</text><text x="312" y="134" fill="#94A3B8" font-size="11">silenced, verified, on</text><rect x="460" y="16" width="136" height="96" rx="10" fill="#E11D48"/><text x="472" y="88" fill="#E2E8F0" font-size="13" font-weight="600">Crimson Rose</text><text x="472" y="104" fill="#E2E8F0" font-size="11" opacity=".8" font-family="ui-monospace, Menlo, monospace">#E11D48</text><text x="460" y="134" fill="#94A3B8" font-size="11">the rose; held back</text><rect x="608" y="16" width="136" height="96" rx="10" fill="#F7608A"/><text x="620" y="88" fill="#E2E8F0" font-size="13" font-weight="600">Rose (text)</text><text x="620" y="104" fill="#E2E8F0" font-size="11" opacity=".8" font-family="ui-monospace, Menlo, monospace">#F7608A</text><text x="608" y="134" fill="#94